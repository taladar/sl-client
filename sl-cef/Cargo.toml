[package]
name = "sl-cef"
version = { workspace = true }
authors = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
description = "Offscreen Chromium (CEF) web-media engine for Second Life / OpenSim viewers — windowless browser surfaces behind an engine-agnostic MediaBackend trait (CPU BGRA frames, portable input, per-surface isolation)"
readme = { workspace = true }
license = { workspace = true }

repository = { workspace = true }
keywords = ["browser", "cef", "media", "opensim", "secondlife"]
categories = ["game-development", "rendering", "web-programming"]
publish = { workspace = true }

exclude = { workspace = true }

[dependencies]
cef = { version = "150.2.1" }
fs-err = { workspace = true }
# The embedder's quit signals, saved before CEF starts and restored after
# (`EmbedderSignals`): Chromium installs handlers of its own.
libc = { version = "0.2.186" }
sl-media = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }

[lints.clippy]
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
as_conversions = "deny"
expect_used = "deny"
indexing_slicing = "deny"
missing_docs_in_private_items = "deny"
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"

# This crate deliberately does NOT inherit the workspace lints: like
# `sl-j2c-encode` it owns `unsafe` FFI (reading CEF's paint buffers), which
# the workspace-wide `unsafe_code = "forbid"` policy would reject. Unsafe is
# permitted here but every block must still carry a safety comment.
[lints.rust]
missing_docs = "warn"
unsafe_code = "allow"
