[package]
name = "sl-marketplace"
description = "Sans-I/O model of the Second Life Marketplace (SLM) DirectDelivery JSON REST API"
readme = "README.md"
license = "LGPL-2.1-only"
version = "0.1.0"
authors = ["Matthias Hörmann <mhoermann@gmail.com>"]
edition = "2024"
rust-version = "1.94.0"

publish = false
repository = "https://github.com/taladar/sl-client"
keywords = ["secondlife", "marketplace", "slm", "json", "sans-io"]
categories = ["api-bindings", "encoding"]

exclude = [".env", "tarpaulin-report.html", "tarpaulin-report.json"]

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145" }
sl-types = { version = "0.8.0" }
thiserror = { version = "2.0.18" }

[dev-dependencies]
pretty_assertions = { version = "1.4.1" }
uuid = { version = "1.18.1" }

[lints]
workspace = true
