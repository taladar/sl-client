[package]
name = "sl-viewer-preferences"
description = "The Second Life / OpenSim viewer's preferences: the tabbed floater over every setting, the quick-preferences popover, and the debug-settings editor"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
readme.workspace = true
repository.workspace = true
license.workspace = true
keywords = ["secondlife", "opensim", "viewer", "settings"]
categories = ["game-development"]
exclude.workspace = true
publish.workspace = true

[dependencies]
# Not a workspace dependency: members disagree about `default-features`, so the
# spec stays per-crate (see the root manifest).
bevy = { version = "0.19.0" }
bevy_flair = { version = "0.8.0" }
bevy_fluent = { version = "0.15.0" }
fs-err = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sl-audio = { path = "../sl-audio", version = "0.1.0" }
sl-client-bevy = { workspace = true, features = [
  "bevy_pbr",
] }
sl-rlv = { path = "../sl-rlv", version = "0.1.0" }
sl-settings = { path = "../sl-settings", version = "0.1.0" }
sl-viewer-audio = { workspace = true }
sl-viewer-environment = { workspace = true }
sl-viewer-inventory = { workspace = true }
sl-viewer-kit = { workspace = true }
sl-viewer-notifications = { workspace = true }
sl-viewer-platform = { workspace = true }
sl-viewer-settings = { workspace = true }
sl-viewer-ui-core = { workspace = true }
sl-viewer-ui-widgets = { workspace = true }
sl-viewer-world-api = { workspace = true }
sl-viewer-world-scene = { workspace = true }
sl-viewer-world-view = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
# Test-only: the tests below assert that every row binds a setting the viewer
# really declares, which means running the owning feature's registrar. The keys
# themselves come from `sl-viewer-settings`, so neither crate is a dependency of
# the library — only of the tests that check the two agree.
sl-viewer-world-avatar = { workspace = true }
sl-viewer-world-objects = { workspace = true }
uuid = { workspace = true }

[lints]
workspace = true
