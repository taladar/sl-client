[package]
name = "sl-viewer-environment"
description = "The Second Life / OpenSim viewer's environment editors: the Personal Lighting floater and the local sky / water override it drives"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
readme.workspace = true
repository.workspace = true
license.workspace = true
keywords = ["secondlife", "opensim", "viewer", "environment"]
categories = ["game-development"]
exclude.workspace = true
publish.workspace = true

[dependencies]
# Not a workspace dependency: members disagree about `default-features`, so the
# spec stays per-crate (see the root manifest).
bevy = { version = "0.19.0" }
# Its action buttons and track buttons carry shared state classes, so this
# crate names the CSS engine directly, as the other panel crates do. Already in
# the closure through sl-viewer-ui-core; the package set is unchanged.
bevy_flair = { version = "0.8.0" }
fs-err = { workspace = true }
sl-client-bevy = { workspace = true }
sl-viewer-intents = { workspace = true }
sl-viewer-inventory = { workspace = true }
sl-viewer-notifications = { workspace = true }
sl-viewer-pickers = { workspace = true }
sl-viewer-platform = { workspace = true }
sl-viewer-settings = { workspace = true }
sl-viewer-ui-core = { workspace = true }
sl-viewer-ui-widgets = { workspace = true }
sl-viewer-world-api = { workspace = true }
sl-viewer-world-scene = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }

[lints]
workspace = true
