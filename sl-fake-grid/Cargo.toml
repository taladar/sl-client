[package]
name = "sl-fake-grid"
version = { workspace = true }
authors = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
description = "In-process loopback fake Second Life grid over the sans-I/O SimSession/SimCaps machinery: HTTP login + CAPS endpoints and a UDP pump for integration tests and manual viewer testing"
readme = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
keywords = ["opensim", "secondlife", "server", "simulator", "testing"]
categories = ["network-programming", "simulation"]
exclude = { workspace = true }
publish = { workspace = true }

[[bin]]
name = "sl-fake-grid"
path = "src/bin/sl-fake-grid.rs"

[dependencies]
bytes = { workspace = true }
clap = { workspace = true, features = ["cargo", "derive", "env"] }
http = "1.4.2"
http-body-util = "0.1.4"
hyper = { version = "1.10.1", features = ["http1", "server"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
sl-proto = { workspace = true }
sl-types = { workspace = true }
sl-wire = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "tracing-log"] }
url = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
pretty_assertions = { workspace = true }
reqwest = { workspace = true }
sl-client-tokio = { workspace = true }

[lints]
workspace = true
