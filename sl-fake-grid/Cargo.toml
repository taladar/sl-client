[package]
name = "sl-fake-grid"
version = { workspace = true }
authors = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
description = "In-process loopback fake Second Life grid over the sans-I/O SimSession/SimCaps machinery: HTTP login + CAPS endpoints and a UDP pump for integration tests and manual viewer testing"
readme = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
keywords = ["opensim", "secondlife", "server", "simulator", "testing"]
categories = ["network-programming", "simulation"]
exclude = { workspace = true }
publish = { workspace = true }

[[bin]]
name = "sl-fake-grid"
path = "src/bin/sl-fake-grid.rs"

[dependencies]
bytes = { workspace = true }
clap = { workspace = true, features = ["cargo", "derive", "env"] }
fs-err = { workspace = true }
http = "1.4.2"
http-body-util = "0.1.4"
hyper = { version = "1.10.1", features = ["http1", "server"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
md5 = { workspace = true }
parking_lot = { workspace = true }
sl-avatar = { workspace = true }
# The central bake service composites with the client's own baker.
sl-bake = { path = "../sl-bake", version = "0.1.0" }
# Reading the item a copy out of a notecard is made of.
sl-notecard = { path = "../sl-notecard", version = "0.1.0" }
sl-object-asset = { workspace = true }
sl-proto = { workspace = true }
sl-test-assets = { workspace = true }
# Decoding the layer textures a bake is made of, and encoding the bake.
sl-texture = { path = "../sl-texture", version = "0.1.0", features = ["decode", "encode"] }
sl-types = { workspace = true }
sl-wire = { workspace = true }
thiserror = { workspace = true }
# Pacific daylight-saving time for the login's `daylight_savings` flag.
time = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "tracing-log"] }
url = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
pretty_assertions = { workspace = true }
reqwest = { workspace = true }
sl-anim = { workspace = true }
sl-client-tokio = { workspace = true }
# The catalogue's rigged mesh asset is read back through the viewer's decoder.
sl-mesh = { workspace = true }
# `test-util` for the paused clock the injectable-clock tests run on.
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
