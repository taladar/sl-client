[package]
name = "sl-conformance"
version = { workspace = true }
authors = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
description = "Manual live-grid conformance test harness for sl-client: runs one feature test at a time against OpenSim or Second Life Beta and records git-stamped results"
readme = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
keywords = ["cli", "conformance", "opensim", "secondlife", "testing"]
categories = ["command-line-utilities", "network-programming"]
exclude = { workspace = true }
publish = { workspace = true }

[[bin]]
name = "sl-conformance"
path = "src/bin/sl-conformance.rs"

[[bin]]
name = "sl-conformance-report"
path = "src/bin/sl-conformance-report.rs"

[[bin]]
name = "sl-conformance-trace"
path = "src/bin/sl-conformance-trace.rs"

[dependencies]
clap = { workspace = true, features = ["cargo", "derive", "env"] }
clap_complete = { workspace = true }
clap_mangen = { workspace = true }
etherparse = { version = "0.20.2" }
fs-err = { workspace = true }
owo-colors = "4.3.0"
pcap-file = { version = "2.0.0" }
# The world-map case asks the grid's tile server and its `MapLayer`
# capability directly: neither is something the client crate fetches.
reqwest = { workspace = true, features = ["rustls-tls"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sl-anim = { workspace = true }
sl-client-tokio = { workspace = true }
sl-fake-grid = { path = "../sl-fake-grid", version = "0.1.0" }
# The materials case sends the overrides the viewer's own encoder writes and
# reads a grid's answer with its decoder.
sl-material = { workspace = true }
# The upload census sends a model with a physics shape of its own making and
# a sound in two channels, which the fixture table has no reason to hold.
sl-mesh = { workspace = true }
# The notecard census writes and reads embedded items with the viewer's own
# codec.
sl-notecard = { path = "../sl-notecard", version = "0.1.0" }
sl-object-asset = { workspace = true }
sl-repl = { workspace = true }
sl-sound = { path = "../sl-sound", version = "0.1.0" }
# The seeded fixture table the fake grid's inventory is built from: the
# asset-round-trip case asserts against the same bodies the grid serves, so
# neither side can drift from the other.
sl-test-assets = { workspace = true }
sl-types = { workspace = true }
sl-wire = { workspace = true, features = ["serde"] }
thiserror = { workspace = true }
time = { workspace = true, features = ["formatting", "parsing"] }
tokio = { workspace = true, features = ["full"] }
toml = { workspace = true }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "tracing-log"] }
url = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
tracing-journald = "0.3.2"

[dev-dependencies]
pretty_assertions = { workspace = true }
# The touch census plants a probe script; its test compiles the source the
# way a grid would before a live run finds out it does not.
sl-lsl-runtime = { workspace = true }
# `test-util` for the paused clock the case-isolation timeout test runs on.
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
