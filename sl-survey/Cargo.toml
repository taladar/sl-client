[package]
name = "sl-survey"
version = { workspace = true }
authors = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
description = "Headless Second Life / OpenSim survey client: teleports across regions collecting parcel and region data"
readme = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
keywords = ["cli", "client", "opensim", "secondlife", "survey"]
categories = ["command-line-utilities", "network-programming"]
exclude = { workspace = true }
publish = { workspace = true }

[package.metadata.deb]
name = "sl-survey"
depends = "$auto"
extended-description = "Headless Second Life / OpenSim survey client: teleports across regions collecting parcel and region data"
section = "database"
copyright = "2026, Matthias Hörmann <mhoermann@gmail.com>"
assets = [
  ["target/release/sl-survey", "usr/bin/", "755"],
]
maintainer-scripts = "maintainer-scripts"
changelog = "changelog"
revision = "1"

[package.metadata.rpm.cargo]
buildflags = ["--release"]

[package.metadata.rpm.targets]
sl-survey = { path = "/usr/bin/sl-survey" }

[package.metadata.generate-rpm]
assets = [
  { source = "target/release/sl-survey", dest = "/usr/bin/sl-survey", mode = "755" },
]

[dependencies]
clap = { workspace = true, features = ["cargo", "derive", "env"] }
clap_complete = { workspace = true }
clap_mangen = { workspace = true }
humantime = "2.3.0"
log-panics = { version = "2.1.0", features = ["with-backtrace"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sl-client-tokio = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "tracing-log"] }
url = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
tracing-journald = "0.3.2"

[dev-dependencies]
pretty_assertions = { workspace = true }

[lints]
workspace = true
