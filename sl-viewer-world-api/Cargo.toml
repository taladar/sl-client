[package]
name = "sl-viewer-world-api"
description = "The Second Life / OpenSim viewer's shared world state: the selection, edit modes, mute list, buddy list, group memberships, presence and map tracking every feature surface reads"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
readme.workspace = true
repository.workspace = true
license.workspace = true
keywords = ["secondlife", "opensim", "viewer", "state"]
categories = ["game-development"]
exclude.workspace = true
publish.workspace = true

[dependencies]
# Not a workspace dependency: members disagree about `default-features`, so the
# spec stays per-crate (see the root manifest).
bevy = { version = "0.19.0" }
serde = { workspace = true, features = ["derive"] }
sl-client-bevy = { workspace = true }
sl-terrain = { path = "../sl-terrain", version = "0.1.0" }
sl-viewer-settings = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }

[lints]
workspace = true
