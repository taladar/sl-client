# Per-repo configuration for roadmap/coord.sh. Sourced as shell.
#
# See the `roadmap` skill's references/coordination.md for what each key does
# and for the two ways these numbers can make things worse rather than better.

# Two heavy operations at a time. The workspace's largest crate
# (sl-client-bevy-viewer) compiles in a single enormous codegen unit, so a full
# build of it must run with --exclusive rather than sharing the machine.
SLOTS=2

# Everything is committed on the current branch here; master is the trunk.
BASE_BRANCH='master'

# What the PreToolUse hook treats as heavy. `git commit` belongs on this list
# because the pre-commit hook runs cargo-hack's feature powerset and the full
# nextest suite -- committing *is* a large build. Cheap cargo subcommands
# (fmt, tree, metadata, --version) are deliberately absent.
HEAVY_PATTERNS='(^|[;&|[:space:]])(cargo[[:space:]]+(build|check|clippy|test|nextest|doc|run|bench|hack|deny|about)|git[[:space:]]+(commit|push))([[:space:]]|$)'

# Free-memory floors, MiB. The machine has 62 GiB and no swap. A single
# sl_client_bevy_viewer rustc has been measured near 16 GiB, and a language
# server can be holding several more, so an exclusive run waits for real room.
MIN_AVAIL_MB=6000
MIN_AVAIL_EXCLUSIVE_MB=20000

# A system update is a third compiler this pool knows nothing about, and has
# already been one half of an out-of-memory kill here. ~/.zsh.d/bin/sysupdate
# deliberately runs emerge as `systemd-run --scope -u emerge`, so the scope's
# cgroup is an exact, cheap probe -- no process-name matching needed.
EXTERNAL_LOAD_DETECT='[ -d /sys/fs/cgroup/system.slice/emerge.scope ]'

# Run every heavy command in its own transient systemd scope. This is the part
# that keeps an OOM kill from taking the agent session down with the build.
USE_SCOPE=1

# Percentages of total RAM. These are deliberately generous: a cap below what a
# build genuinely needs converts a slow success into a hard failure, which is
# the one way this mechanism can be worse than nothing. Tighten them only from
# a measured peak (read memory.peak from the scope's cgroup after a run).
SCOPE_MEMORY_MAX='35%'
SCOPE_MEMORY_MAX_EXCLUSIVE='80%'

# Left empty on purpose. With no swap, a MemoryHigh below the real working set
# does not throttle-then-succeed -- it thrashes reclaim indefinitely, which is
# indistinguishable from a hang. A prompt kill is more useful.
SCOPE_MEMORY_HIGH=''
