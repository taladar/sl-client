[package]
name = "sl-viewer-people"
description = "The Second Life / OpenSim viewer's people surfaces: the People floater and its friends, groups and blocked panes, the radar, profiles, contact sets, conversations, and presence"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
readme.workspace = true
repository.workspace = true
license.workspace = true
keywords = ["secondlife", "opensim", "viewer", "social"]
categories = ["game-development"]
exclude.workspace = true
publish.workspace = true

[dependencies]
# Not a workspace dependency: members disagree about `default-features`, so the
# spec stays per-crate (see the root manifest).
bevy = { version = "0.19.0" }
bevy_flair = { version = "0.8.0" }
fs-err = { workspace = true }
jiff = { version = "0.2.35" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sl-anim = { workspace = true }
sl-client-bevy = { workspace = true, features = [
  "bevy_pbr",
] }
sl-l10n = { path = "../sl-l10n", version = "0.1.0" }
sl-settings = { path = "../sl-settings", version = "0.1.0" }
sl-viewer-chat = { workspace = true }
sl-viewer-inventory = { workspace = true }
sl-viewer-kit = { workspace = true }
sl-viewer-map = { workspace = true }
sl-viewer-media = { workspace = true }
sl-viewer-notices = { workspace = true }
sl-viewer-notifications = { workspace = true }
sl-viewer-platform = { workspace = true }
sl-viewer-settings = { workspace = true }
sl-viewer-ui-core = { workspace = true }
sl-viewer-ui-widgets = { workspace = true }
sl-viewer-world-api = { workspace = true }
sl-viewer-world-objects = { workspace = true }
sl-viewer-world-view = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }

[lints]
workspace = true
