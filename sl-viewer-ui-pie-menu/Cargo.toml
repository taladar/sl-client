[package]
name = "sl-viewer-ui-pie-menu"
description = "The Second Life / OpenSim viewer's radial (pie) menu widget, whose slices are placed by compass point rather than by flexbox"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
readme.workspace = true
repository.workspace = true
license.workspace = true
keywords = ["secondlife", "opensim", "viewer", "ui", "menu"]
categories = ["gui", "game-development"]
exclude.workspace = true
publish.workspace = true

[dependencies]
# Not a workspace dependency: members disagree about `default-features`, so the
# spec stays per-crate (see the root manifest). `system_font_discovery` because
# the slice labels are real, measured text.
bevy = { version = "0.19.0", features = ["system_font_discovery"] }
# The captions carry skin classes (`PieLabelRole::class`), so this crate names
# the CSS engine directly — as the other widget crates do. Already in the
# closure through sl-viewer-ui-core, so the package set is unchanged.
bevy_flair = { version = "0.8.0" }
sl-viewer-ui-core = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
sl-viewer-testkit = { workspace = true }

[lints]
workspace = true
