[package]
name = "sl-repl"
version = { workspace = true }
authors = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
description = "Shared library for an interactive Second Life / OpenSim REPL test client: command grammar, parser, and registry over sl-proto"
readme = { workspace = true }
license = { workspace = true }

repository = { workspace = true }
keywords = ["client", "opensim", "protocol", "repl", "secondlife"]
categories = ["command-line-utilities", "network-programming"]
publish = { workspace = true }

exclude = { workspace = true }

[dependencies]
clap = { workspace = true, features = ["cargo", "derive", "env"] }
# `clippy.toml` disallows `std::fs` so a read error names the file it failed on
# — which for the credentials file is the whole diagnostic.
fs-err = { workspace = true }
serde = { workspace = true, features = ["derive"] }
sl-proto = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }

[lints]
workspace = true
