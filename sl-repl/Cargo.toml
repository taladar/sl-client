[package]
name = "sl-repl"
version = { workspace = true }
authors = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
description = "Shared library for an interactive Second Life / OpenSim REPL test client: command grammar, parser, and registry over sl-proto"
readme = { workspace = true }
license = { workspace = true }

repository = { workspace = true }
keywords = ["client", "opensim", "protocol", "repl", "secondlife"]
categories = ["command-line-utilities", "network-programming"]
publish = { workspace = true }

exclude = { workspace = true }

[dependencies]
clap = { workspace = true, features = ["cargo", "derive", "env"] }
# The login-cooldown stamps live in the user's state directory.
directories = { version = "6.0.0" }
# `clippy.toml` disallows `std::fs` so a read error names the file it failed on
# — which for the credentials file is the whole diagnostic.
fs-err = { workspace = true }
serde = { workspace = true, features = ["derive"] }
# `script check` and the rendering of a compile error read the source.
sl-llsd = { workspace = true }
sl-lsl = { workspace = true }
sl-proto = { workspace = true }
# Decodes an `LSLSyntax` document for `script check syntax=`.
sl-wire = { workspace = true }
thiserror = { workspace = true }
# The login-cooldown stamps are RFC 3339 times.
time = { workspace = true, features = ["formatting", "parsing"] }
toml = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
pretty_assertions = { workspace = true }

[lints]
workspace = true
