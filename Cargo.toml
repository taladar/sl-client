# bevy_flair 0.9.0 + these fixes (1-3 submitted upstream); drop the patch once a
# release carries them. All flair crates come from the same fork so the graph
# never mixes registry and fork copies.
#
#  1. recalculate_style-on-Reset: a debug-build panic / release-build silent
#     reset downgrade when a freshly spawned widget is swept into a
#     sibling/descendant recalculation in the same frame.
#  2. a text `::before` spawns without a `StyleData`, which
#     `PseudoElement`'s insert hook `expect`s, so `PseudoElementsSupport` on
#     a `Text` panics in any app without the full plugin stack (every widget
#     unit test). The block branch of the same function already spawned one.
#  3. a text `::before` took bevy's default 20 px `TextFont` instead of
#     inheriting its host's, as CSS says a pseudo-element does. The span is
#     measured as part of the host's text block, so a 14 px checkbox box with
#     a `content` tick reported 20 px of content and overflowed itself, and
#     taffy folded that into every ancestor up to the floater.
#  4. `sync_em_size` skips a node spawned after this frame's style pass, which
#     has no computed values yet, instead of tripping a debug assertion.
#  5. restyling an entity took **every** styled component on it mutably before
#     asking whether any of its properties had changed, and the borrow alone
#     flags a component changed — so a `background-color` animation (an unread
#     tab's pulse) flagged `Node`, `TextFont` and `TextLayout` changed on every
#     frame it ran, and `bevy_ui` re-laid-out and re-measured for a colour.
#     A component is now touched only when one of its own properties changed.
