naga = { git = "https://github.com/taladar/wgpu.git", rev = "72126feaceecfe82a2b0fa5e37ac7e787920e107" }
# Fork of wgpu 29.0.4 (github.com/taladar/wgpu, branch
# sl-client-texture-init-fastpath) carrying ONE change vs the v29.0.4 tag: a
# fast path in `wgpu-core`'s texture memory-init registration
# (`register_init_action`) that short-circuits when a texture is fully
# initialized and no discards are outstanding, skipping the per-mip
# `check_action` walk + allocation. That bookkeeping runs once per texture use
# per draw per view and profiling (perf, aditi dense scene) put it at ~18% of
# the render thread inside `submit_pending_command_buffers`, all redundant for
# our once-uploaded, never-uninitialized textures. Behaviour is identical to the
# unpatched slow path; only the redundant work is skipped.
#
# Every wgpu-monorepo crate at 29.0.4 is pinned to the same fork rev (not just
# wgpu-core): the crates are workspace members that depend on each other by path,
# so leaving siblings on crates.io would give the graph two non-unifying copies
# (same reason the bevy fork pins every bevy_* crate). `naga_oil` is a separate
# crate and stays on crates.io (it uses the forked `naga` transitively). Pinned
# to a rev for reproducibility. NOT for upstream submission.
wgpu = { git = "https://github.com/taladar/wgpu.git", rev = "72126feaceecfe82a2b0fa5e37ac7e787920e107" }
wgpu-core = { git = "https://github.com/taladar/wgpu.git", rev = "72126feaceecfe82a2b0fa5e37ac7e787920e107" }
wgpu-core-deps-apple = { git = "https://github.com/taladar/wgpu.git", rev = "72126feaceecfe82a2b0fa5e37ac7e787920e107" }
wgpu-core-deps-wasm = { git = "https://github.com/taladar/wgpu.git", rev = "72126feaceecfe82a2b0fa5e37ac7e787920e107" }
wgpu-core-deps-windows-linux-android = { git = "https://github.com/taladar/wgpu.git", rev = "72126feaceecfe82a2b0fa5e37ac7e787920e107" }
wgpu-hal = { git = "https://github.com/taladar/wgpu.git", rev = "72126feaceecfe82a2b0fa5e37ac7e787920e107" }
wgpu-naga-bridge = { git = "https://github.com/taladar/wgpu.git", rev = "72126feaceecfe82a2b0fa5e37ac7e787920e107" }
wgpu-types = { git = "https://github.com/taladar/wgpu.git", rev = "72126feaceecfe82a2b0fa5e37ac7e787920e107" }

[profile.dev]
# Light optimization for our own crates. Bevy's baseline advice leaves these at
# opt-level 0 on the assumption the engine dominates frame time, but that does
# not hold here: this workspace carries a lot of performance-sensitive code of
# its own (the pose driver, culling, UI layout, the parry3d raycast index), and
# unoptimized it is too slow to run. opt-level 1 keeps most of the runtime win
# for a small fraction of opt-level 3's compile cost, and leaves debug
# assertions and overflow checks on.
opt-level = 1
# Same reasoning as release, and more clear-cut: debug builds are not used for
# debugging here, so full DWARF in them is pure cost. This is also what shrinks
# `target/debug` and ggh's `target/nextest_check`, both of which build with the
# dev profile.
debug = "line-tables-only"

[profile.dev.package."*"]
# Optimize every dependency (bevy, wgpu, parry3d, ...) fully even in a dev
# build. This is Bevy's standard fast-build recommendation: the dependency wall
# compiles once and is cached, so paying opt-level 3 there is nearly free per
# iteration, while the crates that actually change between builds sit at
# opt-level 1 above. Together these are what make a dev build runnable, so
# iteration no longer has to go through a release build.
opt-level = 3

[profile.release]
# Line tables, not full DWARF. Profiling here happens on release builds (a debug
# build is too slow to run) with Tracy and `perf`, plus `gdb -p <pid> -ex
# "thread apply all bt"` for hung-thread backtraces. All of those need symbol
# names, file:line and inline frames — which line tables carry in full. `perf
# --call-graph dwarf` unwinds through `.eh_frame`, which is emitted regardless.
#
# What full `debug = 2` adds on top is the variable/type descriptions only a
# debugger inspecting locals reads: measured on this workspace's viewer binary,
# `.debug_info` (932 MB) + `.debug_str` (863 MB) + `.debug_loc` (757 MB) out of
# 2.86 GB of DWARF in a 3.17 GB binary whose `.text` is just 113 MB. Dropping
# them keeps every profiling workflow intact while cutting the binary, the link
# time, the link's peak RSS and the build-cache footprint by roughly 10x.
#
# Use `--profile release-debug` below on the rare occasion locals are needed.
debug = "line-tables-only"

# Release plus full DWARF, for the rare debugger session that needs local
# variables. Its own profile so it builds into `target/release-debug/` and never
# invalidates the normal release artifacts.
[profile.release-debug]
inherits = "release"
debug = 2
