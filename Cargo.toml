# Temporarily build against a fork of parley, pinned by revision.
#
# `bevy_text` 0.19 pins `parley 0.9.0`, and three fixes we need are not in it. A
# `[patch]` must resolve to a semver-compatible version, so upstream `main`
# (0.11) cannot be used here; `sl-client/0.9-patch` is `v0.9.0` plus:
#
# 1. upstream 0.10.0's fix (linebender/parley#685) for a non-printing variation
#    selector being required in the font's `cmap` — no emoji font maps `U+FE0F`,
#    so `❤️` rejected the emoji font outright;
# 2. honouring the emoji presentation selector (VS16) in font selection, so `❤️`
#    is not stolen by a text font that has a dingbat for `U+2764`;
# 3. deleting one grapheme cluster in `backdelete`/`delete` rather than one
#    codepoint, so a ZWJ family no longer takes seven backspaces.
#
# 2 and 3 are submitted upstream (see roadmap/deferred/viewer-ui-text-parley-pr-*).
# **Drop this patch** and return to a plain crates.io parley once `bevy_text`
# moves to parley >= 0.10 and those two land in a release.
#
# Pinned to a rev rather than a branch so the build is reproducible; `fontique`
# comes from the same workspace and must be patched alongside parley, or the two
# would resolve to different builds and their `FamilyId`s would not match.
[patch.crates-io]
# Fork of Bevy 0.19.0 (github.com/taladar/bevy, branch
# sl-client-externally-posed-skin) carrying ONE change vs the v0.19.0 tag: a
# `bevy_pbr` `ExternallyPosedSkin` marker component that excludes GPU-posed
# avatar skins from `extract_skins`' iterate-every-skin per-joint gather (the
# non-cullable CPU floor at crowd scale), while leaving their `SkinUniforms`
# allocation / `current_skin_index` intact. The commit is otherwise the verbatim
# v0.19.0 release.
#
# Every bevy_* crate at 0.19.0 is pinned to the same fork rev, not just
# bevy_pbr: in the monorepo the crates are workspace members that depend on each
# other by path, so a git patch of one pulls its siblings from the fork too;
# leaving the siblings on crates.io would give the graph two copies of e.g.
# bevy_render (a registry one and a fork one) that do not unify. Pinned to a rev
# (not the branch) for reproducibility. To bump Bevy: re-cut the branch off the
# new tag, re-apply the skin.rs/mod.rs diff, and update the rev on every line.
bevy = { git = "https://github.com/taladar/bevy.git", rev = "55d00a73b690fa9bbd5fbeb9e603451ef6f3cbda" }
bevy_a11y = { git = "https://github.com/taladar/bevy.git", rev = "55d00a73b690fa9bbd5fbeb9e603451ef6f3cbda" }
