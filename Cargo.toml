# Temporarily build against a fork of parley, pinned by revision.
#
# `bevy_text` 0.20 pins `parley 0.11`, and the fixes and the one feature we need
# are not in it. A `[patch]` must resolve to a semver-compatible version, so the
# fork is `v0.11.1` plus:
#
# 1. (upstream since 0.10.0, linebender/parley#685: no longer carried);
# 2. honouring the emoji presentation selector (VS16) in font selection, so `❤️`
#    is not stolen by a text font that has a dingbat for `U+2764`;
# 3. deleting one grapheme cluster in `backdelete`/`delete` rather than one
#    codepoint, so a ZWJ family no longer takes seven backspaces;
# 4. `PlainEditor::set_inline_boxes` / `set_range_styles` — the two things a
#    *rich* editor needs that the plain one keeps to itself: boxes laid out in
#    the flow of the text (a notecard's embedded inventory items) and style
#    properties scoped to a byte range (a link's colour, a hidden marker). The
#    layout builders model both already; `PlainEditor` simply owns its builder.
#    Used by `sl-viewer-ui-widgets`' rich-text field.
# 5. laying a `PlainEditor` out a paragraph at a time: each paragraph's broken
#    layout is kept and reused while its text, styles and boxes are unchanged,
#    and the paragraphs are joined into the one layout the caret works on — a
#    keystroke in a 64 KB script re-shapes one line instead of all 2,700 (about
#    20 ms down to 2–8 ms, `sl-viewer-ui-widgets/tests/editor_relayout.rs`).
#    Edits now also move the range styles and inline boxes with the text, which
#    is what lets the relayout an edit forces reuse everything after it.
#
# 2 and 3 are submitted upstream (see roadmap/deferred/viewer-ui-text-parley-pr-*).
# **Drop this patch** and return to a plain crates.io parley once `bevy_text`
# moves to a parley release carrying them and an equivalent of 4 and 5.
#
# Pinned to a rev rather than a branch so the build is reproducible; `fontique`
# comes from the same workspace and must be patched alongside parley, or the two
# would resolve to different builds and their `FamilyId`s would not match.
[patch.crates-io]
# Fork of AccessKit (github.com/taladar/accesskit): `accesskit_atspi_common`
# 0.19.1, the version Bevy 0.20's `accesskit_unix` resolves, plus a backport of
# upstream's #788 (6ee0558b63): a disabled node of a role with no read-only
# state (a button) was reported Enabled | Sensitive, so Orca read a greyed button
# as available. Only this crate is patched: the fork's copy depends on the
# crates.io `accesskit` / `accesskit_consumer` rather than its repository
# siblings, since each platform adapter pins its own `accesskit_consumer` and a
# whole-repository patch would split the graph. Drop it once Bevy moves to an
# `accesskit_unix` that resolves a release carrying #788.
accesskit_atspi_common = { git = "https://github.com/taladar/accesskit.git", rev = "aefa73678e82912517fb885b52694d7af5462860" }
# Fork of Bevy 0.20.1 (github.com/taladar/bevy) carrying these changes vs the
# v0.20.1 tag, and otherwise the verbatim release:
#
# - a `bevy_ui_widgets` change that keeps Escape in a text input as it was before
#   0.20: it collapses the selection, keeps focus and is consumed. Upstream's
#   #25105 blurs the field and lets the key propagate, so the press that leaves
#   a field would also reach the viewer's world Escape binding;
# - a `bevy_ui` measure fix: a minimum is a bound, not a size. `resolve_axis`
#   took `min-width` as the effective width, so `min-width: 0` measured a text
#   node at zero width and every word took a line of its own;
# - a `bevy_ui_widgets` fix that makes every widget act on the **primary**
#   pointer button only, instead of on whichever button happened to arrive: a
#   secondary or middle click used to press a button, tick a checkbox, pick a
#   radio, select a list row, choose a menu item and drag a slider or scrollbar
#   exactly as the primary one did, because the handlers never read the event's
#   `button` (`text_input` was the sole exception, and its guard is the idiom the
#   rest now follow). `Activate` also gained a `button: Option<PointerButton>`,
#   `None` for a keyboard activation, so the button is no longer discarded at the
#   `Pointer<Click>` → `Activate` boundary;
# - a `bevy_ui_widgets` fix that mirrors a horizontal slider whose node lays
#   out **right to left** (`Node::direction`): its thumb is placed from the
#   inline start, so the minimum sits at the right end, but a track click was
#   measured from the left edge, a drag added the physical distance and
#   `ArrowRight` stepped up — the value under the pointer was the one mirrored
#   across the track and a drag ran the thumb away from the hand. The click now
#   measures from the right edge, the drag is negated and the arrow keys swap
#   (`viewer-slider-click-mirrored-rtl`);
# - a `bevy_ui_widgets` fix that measures a slider's track click and drag
#   **inside its border** (the padding box an absolutely positioned thumb is
#   placed in) rather than across its border box, which put the value under the
#   pointer one border width away from the thumb and made a drag's travel two
#   border widths too long (`viewer-slider-thumb-offset-by-track-border`);
# - a `bevy_pbr` `ExternallyPosedSkin` marker component that excludes GPU-posed
#   avatar skins from `extract_skins`' iterate-every-skin per-joint gather (the
#   non-cullable CPU floor at crowd scale), while leaving their `SkinUniforms`
#   allocation / `current_skin_index` intact;
# - a `bevy_pbr` light-probe fix that rotates a reflection probe's cubemap
#   through a separate `LightProbeComponent::get_sample_rotation` quaternion
#   rather than by multiplying the rotation into the probe's transform, which
#   sheared the influence volume of every non-uniformly scaled probe and folded
#   its scale into the sampling frame;
# - a `bevy_input_focus` fix that lets only the hit a press *stopped on* decide
#   focus. One press targets every entity a non-blocking `Pickable` left in the
#   hover map, `click_to_focus` raised an `AcquireFocus` for each, and the ones
#   that find no `TabIndex` bubble to the window, whose `acquire_focus` arm
#   *clears* the focus another hit just acquired — so clicking a field under a
#   transparent overlay worked or did nothing depending on `EntityHashMap`
#   order, i.e. on entity ids;
# - a `bevy_text` fix that sizes a text block by the width it was **broken at**,
#   counting the hanging space only where it fits: the space a soft wrap breaks
#   at hangs past the wrap width (as in CSS), so `parley::Layout::full_width`
#   made every wrapping label report a content width up to a quarter em wider
#   than the box it had just been fitted to, and every ancestor inherited the
#   error — while plain `width` is no better, since it shrinks an unbounded run
#   to its ink and a run ending in a space then breaks at the space when it is
#   laid out again at that width, taking a line it draws nothing on;
# - a `bevy_text` fix that measures an **empty** text block at its own font
#   rather than at parley's defaults. Every span's style is pushed over a
#   range, and an empty range was skipped, so a `Text` with no characters was
#   laid out at a 20 px line whatever it declared — which is how a
#   `content`-driven glyph is spawned (a checkbox tick, a radio pip), so a
#   14 px box holding one measured 20 px of content, overflowed itself, and
#   handed those six pixels to every ancestor;
# - a `bevy_text` `ComputedTextBlock::set_entities`, so a widget can name the
#   entities an *editable* field's brush sections resolve against. The renderer
#   reads a glyph's colour (and its underline) from the entity a brush's
#   `section_index` names in that list, which the text pipeline fills in from a
#   `Text` block's spans — an `EditableText` has none, so every per-range brush
#   resolved to nothing and a rich field could not colour a range;
# - a `bevy_pbr` / `bevy_render` fix that prepares 3D materials **after** the
#   `GpuImage`s they sample. `MaterialPlugin` registered its erased render asset
#   with no dependency (2D and UI materials keep the edge), so a material and an
#   image replaced behind the same handle by one of another size could prepare
#   in either order in one frame and bind the old texture view for good;
# - a `bevy_ui_render` fix that skips a **fully transparent** `TextShadow` in
#   `extract_text_shadows`. It draws nothing, but it extracted a second copy of
#   every glyph and decoration of its text all the same — and `text-shadow:
#   none` in a stylesheet is exactly that component, so a skin that shadows its
#   labels only in some themes would double the glyph extraction of every label
#   in the others;
# - a `bevy_ui_render` fix that snaps a nine-sliced image's corner scale to a
#   whole number of **physical** pixels per texel. At a fractional scale factor
#   (1.5) an 8-texel corner spanned 12 px, texel edges fell on pixel centres,
#   and the quad's two triangles rounded the interpolated UV differently — so
#   the `relief` theme's nearest-sampled button frame was 1 px thick on one side
#   of the quad's diagonal and 2 px on the other;
# - a `bevy_ui` fix that stops re-laying-out the whole UI on every frame.
#   `update_editable_text_layout` refreshed every `EditableText`'s editor every
#   frame through `DerefMut`, flagging it changed with nothing having happened,
#   so `update_editable_text_content_size` re-set every field's `ContentSize`
#   and dirtied it and all its ancestors in taffy — layout and text measurement
#   of the whole tree every frame, in proportion to how many fields existed,
#   hidden ones included (~380 ms a frame in the gallery, ~25 ms after). The
#   refresh now bypasses change detection, an unfocused field whose text, node,
#   hinting and target are unchanged is skipped, and the cursor is written only
#   when it differs;
# - a `bevy_ui` `IndependentLayout` marker, and a `ui_layout_system` that lays
#   out only **dirty layout roots**. A marked node stays in the entity
#   hierarchy (inherits, picks, stacks and clips through its parent) but is laid
#   out as its own taffy root against the viewport and placed relative to its
#   parent; a change dirties only the layout root it belongs to. Every free
#   floater carries it (docking takes it off), so a change inside one window
#   re-lays-out that window and nothing else — a free minimap's per-frame
#   compass move went from ~4.3 ms (the whole screen) to ~0.1 ms;
# - a `bevy_render` fix that writes **every mip level** when a `GpuImage`
#   reuses its texture. An image replaced by one of the same descriptor keeps
#   its GPU texture and has the new data copied in, and that copy wrote only
#   level 0 at the base extent, so an image with a mip chain (every world
#   texture, since `viewer-texture-mip-chain-missing`) kept its old lower
#   levels. It now walks every level and layer in the image's data order, as
#   `create_texture_with_data` does for a new texture;
# - a `bevy_window` `OffscreenWindow` marker: a `Window` with no OS window
#   behind it, rendered off-screen. `bevy_winit` creates no platform window for
#   it; `bevy_render` extracts it without a `RawHandleWrapper`, gives it an
#   `Rgba8UnormSrgb` texture of its physical size as its swap chain (kept across
#   frames, never presented) and configures no surface; a screenshot of it reads
#   that texture back. Cameras keep their window target, so picking and every
#   `Window::cursor_position()` reader work with no display at all — the
#   automation tier's windowless viewer (`viewer-automation-offscreen-window-
#   spike`);
# - a `bevy_window` `ViewOnlyWindow` marker: a window shown but not driven.
#   `bevy_winit` drops every input event arriving on it (keyboard, mouse,
#   cursor, wheel, touch, gestures, IME, file drops, focus) and forwards no
#   device mouse motion while every platform window is view-only — the
#   `--watch` window of a headless viewer, which a person looks through while
#   only the synthetic injector moves the viewer
#   (`viewer-automation-windowless-mode`);
# - a `bevy_clipboard` `Clipboard::in_process()`: a clipboard private to the
#   App, an in-process text buffer that never opens the system clipboard, so a
#   test viewer's copy and paste are testable and never touch the user's;
# - a `bevy_tasks` fix that runs every task in the tracing context it was
#   spawned from: the spawner's default subscriber and current span travel with
#   the future to whichever pool thread polls it. The pools are process-wide, so
#   before this a system's log line on a worker thread lost its app's span and
#   bypassed a test's scoped subscriber; now two viewer apps in one process each
#   update inside their own span and every line stays attributable
#   (`viewer-automation-per-app-state`);
# - a `bevy_render` fix that keeps each screenshot's readback task in a
#   render-world resource instead of detaching it, and cancels and awaits the
#   unfinished ones when that resource is dropped: a detached task held the
#   readback buffer, and through it the device, past its app — finishing after
#   `main` returned, it dropped the last device reference while a Vulkan
#   layer's exit handler tore down the same state, and the process died of
#   SIGSEGV after its tests passed (`test-full-stack-sigsegv-at-exit-under-load`).
#   Its map callback hands the result to the task instead of panicking: a
#   cancelled task's buffer drop runs a pending callback with an error, and a
#   panic inside that drop aborted the process.
# - a `bevy_render` fix that makes a dropped `PipelineCache` cancel and wait
#   for every pipeline still compiling on a task-pool thread: a dropped task
#   does not stop a compile already inside the driver, so a viewer process that
#   returned from `main` after a clean logout ran the exit handlers (a Vulkan
#   layer's teardown) beside it and died of SIGSEGV.
#
# Every bevy_* crate is patched to the same fork, not just bevy_pbr: in the
# monorepo the crates are workspace members that depend on each other by path,
# so leaving the siblings on crates.io would give the graph two copies of e.g.
# bevy_render that do not unify. To bump Bevy: re-cut the branch off the new tag
# and re-apply these commits.
