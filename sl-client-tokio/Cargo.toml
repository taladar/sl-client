[package]
name = "sl-client-tokio"
version = { workspace = true }
authors = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
description = "Tokio-based async Second Life / OpenSim client built on sl-proto"
readme = { workspace = true }
license = { workspace = true }

repository = { workspace = true }
keywords = ["async", "client", "opensim", "secondlife", "tokio"]
categories = ["game-development", "network-programming"]
publish = { workspace = true }

exclude = { workspace = true }

[dependencies]
arc-swap = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
flate2 = { workspace = true }
fs-err = { workspace = true }
reqwest = { workspace = true, features = [
  "rustls-tls",
] }
sl-asset = { workspace = true }
sl-material = { workspace = true }
sl-mesh = { workspace = true }
sl-proto = { workspace = true }
sl-texture = { path = "../sl-texture", version = "0.1.0" }
sl-wire = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true, features = ["local-offset"] }
tokio = { workspace = true, features = ["macros", "net", "rt", "sync", "time"] }
tracing = { workspace = true }
url = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
pretty_assertions = { workspace = true }
tokio = { workspace = true, features = [
  "io-util",
  "macros",
  "rt-multi-thread",
  "test-util",
  "time",
] }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
