[package]
name = "sl-viewer-world-objects"
description = "The Second Life / OpenSim viewer's object layer: the prims, meshes, materials and textures a region's state builds into entities"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
readme.workspace = true
repository.workspace = true
license.workspace = true
keywords = ["secondlife", "opensim", "viewer", "rendering"]
categories = ["game-development", "rendering"]
exclude.workspace = true
publish.workspace = true

[dependencies]
# Not a workspace dependency: members disagree about `default-features`, so the
# spec stays per-crate (see the root manifest).
bevy = { version = "0.19.0" }
bytes = { workspace = true }
sl-client-bevy = { workspace = true, features = [
  "bevy_pbr",
] }
sl-settings = { path = "../sl-settings", version = "0.1.0" }
sl-viewer-kit = { workspace = true }
sl-viewer-platform = { workspace = true }
sl-viewer-settings = { workspace = true }
sl-viewer-ui-core = { workspace = true }
sl-viewer-world-api = { workspace = true }
url = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
sl-proto = { workspace = true }

[lints]
workspace = true
