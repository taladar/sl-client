[package]
name = "sl-audio"
version = { workspace = true }
authors = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
description = "Engine-agnostic audio mixer, clip decode, buses, listener & spatialisation for Second Life / OpenSim viewers"
readme = { workspace = true }
license = { workspace = true }

repository = { workspace = true }
keywords = ["audio", "mixer", "opensim", "secondlife", "viewer"]
categories = ["game-development", "multimedia::audio"]
publish = { workspace = true }

exclude = { workspace = true }

[dependencies]
firewheel = { version = "0.12.1", features = [
  "fast_rms_node",
  "mix_node",
  "peak_meter_node",
  "spatial_basic_node",
] }
fixed-resample = { version = "0.12.1" }
# Direct dependency purely to enable the codec features on the `symphonium`
# instance that `firewheel-symphonium` pulls in with only `decode-native`
# (feature unification turns these on for the shared crate).
symphonium = { version = "0.12.2", default-features = false, features = [
  "decode-native",
  "fft-resampler",
  "ogg",
  "pcm",
  "vorbis",
  "wav",
] }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[lints]
workspace = true
