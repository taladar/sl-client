[package]
name = "sl-viewer-automation"
description = "The Second Life / OpenSim viewer's automation layer: a semantic model of the UI (roles, accessible names, states, values, geometry and visibility) read from the ECS on request, for tests, agents and assistive technology"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
readme.workspace = true
repository.workspace = true
license.workspace = true
keywords = ["secondlife", "opensim", "viewer", "automation", "accessibility"]
categories = ["development-tools::testing", "gui"]
exclude.workspace = true
publish.workspace = true

[dependencies]
# Not a workspace dependency: members disagree about `default-features`, so the
# spec stays per-crate (see the root manifest). The feature matches the UI
# crates this one reads, so the two unify on one Bevy build.
bevy = { version = "0.19.0", features = ["system_font_discovery"] }
bevy_flair = { version = "0.8.0" }
# Writing a screenshot's PNG, with the path in the error.
fs-err = { workspace = true }
# PNG encoding of a captured frame; the version Bevy's own image support uses.
image = { version = "0.25.10", default-features = false, features = ["png"] }
# A state wait tests a probe's readout as JSON, at a JSON Pointer.
serde_json = { workspace = true }
sl-automation-proto = { workspace = true }
sl-client-bevy = { workspace = true }
sl-viewer-inventory = { workspace = true }
sl-viewer-kit = { workspace = true }
sl-viewer-notifications = { workspace = true }
sl-viewer-ui-core = { workspace = true }
sl-viewer-ui-pie-menu = { workspace = true }
sl-viewer-ui-widgets = { workspace = true }
sl-viewer-world-api = { workspace = true }
thiserror = { workspace = true }
# The remote transport's listener, on the shared runtime `sl-client-bevy` owns.
tokio = { workspace = true, features = [
  "io-util",
  "macros",
  "net",
  "rt",
  "sync",
  "time",
] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
sl-viewer-testkit = { workspace = true }

[lints]
workspace = true
