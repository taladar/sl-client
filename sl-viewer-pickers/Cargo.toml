[package]
name = "sl-viewer-pickers"
description = "The Second Life / OpenSim viewer's chooser floaters: pick a resident, pick a texture or material, and the reusable swatch that shows the result"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
readme.workspace = true
repository.workspace = true
license.workspace = true
keywords = ["secondlife", "opensim", "viewer", "ui"]
categories = ["game-development"]
exclude.workspace = true
publish.workspace = true

[dependencies]
# Not a workspace dependency: members disagree about `default-features`, so the
# spec stays per-crate (see the root manifest).
bevy = { version = "0.19.0" }
bevy_flair = { version = "0.8.0" }
sl-client-bevy = { workspace = true, features = [
  "bevy_pbr",
] }
sl-viewer-inventory = { workspace = true }
sl-viewer-ui-core = { workspace = true }
sl-viewer-ui-widgets = { workspace = true }
sl-viewer-world-api = { workspace = true }
sl-viewer-world-objects = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
sl-viewer-testkit = { workspace = true }

[lints]
workspace = true
