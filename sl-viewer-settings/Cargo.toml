[package]
name = "sl-viewer-settings"
description = "The Second Life / OpenSim viewer's persistent settings store: declared defaults with global and per-avatar override scopes"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
readme.workspace = true
repository.workspace = true
license.workspace = true
keywords = ["secondlife", "opensim", "viewer", "settings", "configuration"]
categories = ["config", "game-development"]
exclude.workspace = true
publish.workspace = true

[dependencies]
# Not a workspace dependency: members disagree about `default-features`, so the
# spec stays per-crate (see the root manifest).
bevy = { version = "0.19.0" }
fs-err = { workspace = true }
sl-account-dirs = { workspace = true }
sl-client-bevy = { workspace = true }
sl-settings = { path = "../sl-settings", version = "0.1.0" }
sl-viewer-platform = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }

[lints]
workspace = true
