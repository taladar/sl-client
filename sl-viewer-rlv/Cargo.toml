[package]
name = "sl-viewer-rlv"
description = "The Second Life / OpenSim viewer's RLVa control surface: the console, the restrictions, strings and locks floaters, and the behaviour toggles behind them"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
readme.workspace = true
repository.workspace = true
license.workspace = true
keywords = ["secondlife", "opensim", "viewer", "rlv"]
categories = ["game-development"]
exclude.workspace = true
publish.workspace = true

[dependencies]
# Not a workspace dependency: members disagree about `default-features`, so the
# spec stays per-crate (see the root manifest).
bevy = { version = "0.19.0" }
sl-client-bevy = { workspace = true }
sl-rlv = { path = "../sl-rlv", version = "0.1.0" }
sl-settings = { path = "../sl-settings", version = "0.1.0" }
sl-viewer-notifications = { workspace = true }
sl-viewer-platform = { workspace = true }
sl-viewer-settings = { workspace = true }
sl-viewer-ui-core = { workspace = true }
sl-viewer-ui-widgets = { workspace = true }
sl-viewer-world-api = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
# The loopback grid the `fake_grid_rlv_commands` tier drives a real owner-say
# through; `sync` for its `broadcast` receivers, `rt-multi-thread` to host it.
sl-fake-grid = { path = "../sl-fake-grid", version = "0.1.0" }
sl-proto = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "sync"] }

[lints]
workspace = true
