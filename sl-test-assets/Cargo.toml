[package]
name = "sl-test-assets"
version = { workspace = true }
authors = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
description = "Procedural test assets — marker-coloured checkers, solids and gradients as RGBA and JPEG2000, sculpt maps and a unit-cube mesh — shared by the sl-client test tiers"
readme = { workspace = true }
license = { workspace = true }

repository = { workspace = true }
keywords = ["fixtures", "jpeg2000", "opensim", "secondlife", "testing"]
categories = ["development-tools::testing", "game-development"]
publish = { workspace = true }

exclude = { workspace = true }

[dependencies]
bytes = { workspace = true }
# The wearable-asset writer behind the library body-part stand-ins: the inverse
# of the `WearableAsset` parser a bake reads them back with, so the fixture and
# the consumer share one definition of the format.
sl-avatar = { workspace = true }
sl-llsd = { workspace = true }
sl-mesh = { workspace = true }
sl-proto = { workspace = true }
sl-sound = { path = "../sl-sound", version = "0.1.0" }
sl-texture = { path = "../sl-texture", version = "0.1.0", features = ["encode"] }
uuid = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
# The animation and material assets the crate writes are read back through the
# viewer's own decoders (the mesh and sound encoders are `sl-mesh`'s and
# `sl-sound`'s own, and the wearable writer is `sl-avatar`'s, so those crates
# are plain dependencies).
sl-anim = { workspace = true }
sl-material = { workspace = true }
# The decoder behind `sl-audio`'s `decode_clip`, used directly so a fixture
# sound is read back the way the viewer reads one without dragging the mixer
# (and its audio device backend) into this crate's tree.
symphonium = { version = "0.12.2", default-features = false, features = [
  "decode-native",
  "ogg",
  "vorbis",
] }

[lints]
workspace = true
