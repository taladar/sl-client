# cargo-about configuration: generates the third-party license text file the
# viewer's About floater embeds. Regenerate with
# `scripts/generate-third-party-licenses.sh` after dependency changes; the
# ggh `rust:::cargo-about-outdated` pre-commit check enforces freshness.
#
# The accepted list mirrors the cargo-deny allowlist in `deny.toml`
# ([licenses].allow + the per-crate exception ids) — keep the two in sync.
accepted = [
  "LGPL-2.1-only",
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Unicode-3.0",
  "Apache-2.0 WITH LLVM-exception",
  "LGPL-3.0-or-later",
  "Zlib",
  "BSD-3-Clause",
  "ISC",
  "CDLA-Permissive-2.0",
  "CC0-1.0",
  # Below: ids that appear only via deny.toml per-crate exceptions
  # (cargo-about's accepted list has no per-crate scoping).
  "BSL-1.0",
  "bzip2-1.0.6",
  "BSD-2-Clause",
  "NCSA",
  "MPL-2.0",
]
