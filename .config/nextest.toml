# Workspace nextest configuration.
#
# The GPU test tiers of `sl-client-bevy-viewer` (the render readback matrix,
# the headless world rig's pixel checks and the full-stack harness against the
# fake grid) each stand up a headless Bevy render app on the real adapter. Two
# of those racing for the GPU under a concurrent build is the load pattern
# that made the tier flake, so they run in one serial test-group. They stay
# in the default run — and therefore in the pre-commit hook — on purpose:
# determinism and serialisation, not exclusion, is the fix.

# No test waits for ever. A wait inside a test is bounded where it is written,
# and this is what catches the one that is not: a test whose every event had
# its own timeout sat for two hours on a grid that kept sending pings. Half
# an hour is past the slowest test outside the groups below, which set their
# own: the `ui_contract` sweeps take ten minutes and more in a debug build.
#
# Four tests at a time overall, and of the tests that start a viewer — the GPU
# tier and the end-to-end tier, each standing up one or more render apps or
# viewer processes — only one at a time between them: two viewers at once on
# this machine is what the parallelism has to stop, whatever group they are in.
[profile.default]
slow-timeout = { period = "60s", terminate-after = 30 }
test-threads = 4

[[profile.default.overrides]]
filter = "test(/^render_readback::/) | test(/^render_matrix::/) | test(/^full_stack_test::/) | test(/^world_test::gpu_/) | binary(viewer_processes)"
test-group = "viewer"
# A capture settles by observation rather than by a fixed frame count, but the
# first pipeline compile on a cold shader cache is slow; give it room before
# nextest calls a test hung.
slow-timeout = { period = "120s", terminate-after = 3 }

[[profile.default.overrides]]
filter = "binary(/^e2e_/)"
test-group = "viewer"
slow-timeout = { period = "180s", terminate-after = 4 }

# The end-to-end tier against a live grid (`SL_E2E_GRID=opensim|aditi`): run
# with `--profile live`. A live login, a settle behind a flaky asset service
# and aditi's two-minute login cooldown between the backends outlast the
# default profile's kill, and a killed test strands its avatars' sessions on
# the grid — so nothing here is terminated, only reported slow.
[profile.live]
[[profile.live.overrides]]
filter = "binary(/^e2e_/)"
test-group = "viewer"
slow-timeout = { period = "300s" }

# The GPU tier and the end-to-end tier (`sl-client-bevy-viewer/tests/e2e_*.rs`,
# the `sl-e2e` stage) share one group: each test stands up a headless render
# app on the real adapter, or starts a fake grid and several viewers —
# processes or in-process Apps — on the one GPU, so they run one at a time
# between them, with room for cold logins on both backends.
[test-groups.viewer]
max-threads = 1
