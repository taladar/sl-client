[package]
name = "sl-client-bevy"
version = { workspace = true }
authors = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
description = "Bevy ECS Second Life / OpenSim client plugin built on sl-proto"
readme = { workspace = true }
license = { workspace = true }

repository = { workspace = true }
keywords = ["bevy", "client", "ecs", "opensim", "secondlife"]
categories = ["game-development", "network-programming"]
publish = { workspace = true }

exclude = { workspace = true }

[features]
# Off by default: the headless client needs no renderer. The windowed viewer
# enables this to pull in Bevy's PBR/render stack and the `TerrainMaterial`
# (a custom 4-way terrain texture-splat material + shader).
default = []
bevy_pbr = ["bevy/bevy_pbr"]

[dependencies]
arc-swap = { workspace = true }
async-trait = { workspace = true }
bevy = { version = "0.19.0", default-features = false, features = [
  "bevy_asset",
  "bevy_image",
  "bevy_mesh",
  # Per-frame avatar visual-param morphs (P31.12a) attach Bevy native morph
  # targets to the base-mesh assets; `Mesh::set_morph_targets` is gated on this.
  "morph",
] }
bytes = { workspace = true }
crossbeam-channel = { workspace = true }
flate2 = { workspace = true }
fs-err = { workspace = true }
reqwest = { workspace = true, features = [
  "blocking",
  "rustls-tls",
] }
sl-account-dirs = { workspace = true }
sl-anim = { workspace = true }
sl-asset = { workspace = true }
sl-avatar = { workspace = true }
sl-bake = { path = "../sl-bake", version = "0.1.0" }
sl-material = { workspace = true }
sl-mesh = { workspace = true }
sl-prim = { workspace = true }
sl-proto = { workspace = true }
sl-sculpt = { path = "../sl-sculpt", version = "0.1.0" }
sl-texture = { path = "../sl-texture", version = "0.1.0" }
sl-tree = { path = "../sl-tree", version = "0.1.0" }
sl-wire = { workspace = true }
time = { workspace = true, features = ["local-offset"] }
# The small shared runtime the async asset fetchers drive (`async_runtime.rs`):
# a few-thread multi-thread runtime so non-blocking `reqwest` downloads are no
# longer pinned at Bevy's 4-wide `IoTaskPool` funnel. `rt-multi-thread` for the
# pool, `net` + `time` for `enable_all()` (the reqwest IO driver and the
# transient-retry backoff sleeps).
tokio = { workspace = true, features = ["net", "rt-multi-thread", "time"] }
tracing = { workspace = true }
url = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
# Matches the version bevy_image re-exports through; used to construct `Image`.
wgpu-types = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
serde_json = { workspace = true }
# The loopback grid the `fake_grid_login_smoke` tier logs the real plugin
# into; `sync` for its `broadcast` receivers, `rt-multi-thread` to host it.
sl-fake-grid = { path = "../sl-fake-grid", version = "0.1.0" }
# The rigged-mesh fixtures the skinning tests round-trip through an asset.
sl-test-assets = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "sync"] }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
