[package]
name = "sl-client-bevy-viewer"
description = "Minimal Bevy visual viewer for Second Life / OpenSim: logs in and renders a region (terrain, prims, meshes, sculpts) with diffuse textures"
readme = "README.md"
license = "LGPL-2.1-only"
version = "0.1.0"
authors = ["Matthias Hörmann <mhoermann@gmail.com>"]
edition = "2024"
rust-version = "1.94.0"

publish = false
repository = "https://github.com/taladar/sl-client"
keywords = ["secondlife", "opensim", "viewer", "bevy", "renderer"]
categories = ["game-development", "rendering", "visualization"]

exclude = [".env", "tarpaulin-report.html", "tarpaulin-report.json"]

[features]
# `spacenav` is on by default, so a plain `cargo build` drives the flycam from an
# attached SpaceNavigator rather than the zeroed stub. It is Linux-only (evdev),
# so a Windows / macOS build must turn it off (`--no-default-features`) until the
# cross-platform read lands (viewer-input-spacenav-crossplatform); the
# `SpacenavInput` stub then keeps consumers `cfg`-free.
default = ["spacenav"]

# Read a 3Dconnexion SpaceNavigator / SpaceMouse 6-DOF device to drive the flycam
# (viewer-input-spacenav-device / -camera-mapping). Linux-only for now (evdev).
spacenav = ["dep:evdev"]

# Profiling (viewer-profiling-logplugin-tracing). The viewer installs its own
# `tracing` subscriber (`init_tracing`) and disables Bevy's `LogPlugin`, because
# login logging happens before the Bevy `App`/window exists. Bevy's built-in
# profilers attach their tracing layers *through* `LogPlugin`, so with it
# disabled they never install. These features re-wire those layers into our own
# subscriber and turn on `bevy/trace` so the per-system spans actually exist.

# Stream Bevy's per-system / per-stage spans to the Tracy profiler UI (live
# frame timeline + per-zone call counts). `bevy/trace_tracy` also makes
# `bevy_render` emit the per-frame `tracy.frame_mark` boundary event our
# `TracyLayer` consumes. Match Tracy GUI version to `tracy-client` (see the book).
#
# `tracing-tracy/ondemand` puts the Tracy client in on-demand mode: it collects
# nothing until a profiler connects and discards on disconnect. Without it the
# client buffers every event in memory the entire time no profiler is attached
# (the "memory grows until a client connects" warning) — an untethered run grows
# without bound, which on a CEF build eventually trips Chromium's memory-dump
# `CHECK`. On-demand keeps memory flat between captures, so the build is safe to
# leave running and connect to only when needed (see book/src/tools/profiling.md).
profile-tracy = [
    "dep:tracing-tracy",
    "tracing-tracy/ondemand",
    "bevy/trace",
    "bevy/trace_tracy",
]

# Tracy with per-allocation memory profiling (higher overhead). Bevy's
# `trace_tracy_memory` installs a process-wide `#[global_allocator]` that reports
# every alloc/free to Tracy, so no allocator wiring is needed on our side.
profile-tracy-memory = ["profile-tracy", "bevy/trace_tracy_memory"]

# Write a Chrome/Perfetto trace file (path from `TRACE_CHROME`, else
# `./trace-<unix-ts>.json`) viewable in Perfetto or `chrome://tracing`. The
# no-GUI fallback for bug reports.
profile-chrome = ["dep:tracing-chrome", "bevy/trace", "bevy/trace_chrome"]

[dependencies]
# OS clipboard for the world map's Copy SLURL (wayland-data-control covers
# running under a Wayland compositor without a focused-window handle).
# Default features off: the default `image-data` support would pull the AVIF
# encoder stack (rav1e & co.) for image clipboards we do not use — text only.
arboard = { version = "3.6.1", default-features = false, features = [
    "wayland-data-control",
] }
avian3d = { version = "0.7.0" }
# `system_font_discovery` turns on parley/fontique OS font enumeration and
# fallback, so CJK / Cyrillic / Arabic / emoji text resolves to the host's fonts
# instead of rendering as tofu (viewer-ui-text-foundation). The colour-emoji
# fallback is bundled separately (see `assets/fonts/`), because the system emoji
# font is usually COLRv1, which swash cannot rasterise.
bevy = { version = "0.19.0", features = ["system_font_discovery", "track_location"] }
# The UI skin / design-token system (viewer-ui-skin-tokens): real CSS
# (selectors, pseudo-classes, `var()` custom-property tokens, `@import` overlay
# merge, hot-reloaded `.css`) as the skin language. `src/skin.rs` registers the
# scaffold's logical box / corner components as CSS-styleable so skins author
# `margin-inline-start` etc. (never physical `left`/`right`, which it bans) and
# the shipped bidi resolver still mirrors the layout. Pinned to `bevy_flair`'s
# own `bevy 0.19` line so the two unify on one Bevy build.
bevy_flair = { version = "0.8.0" }
# The i18n foundation (viewer-i18n-fluent-scaffold): Project Fluent `.ftl`
# bundles behind Bevy assets, with runtime locale switching. `bevy_fluent`
# provides the asset loaders, the `Locale` negotiation input and the
# `Localization` lookup resource; `fluent` / `fluent_content` are its runtime
# types the lookup API (`src/i18n.rs`) builds typed named arguments with and
# formats through (never a pre-formatted string); `unic-langid` is the language
# tag those resources are keyed by.
bevy_fluent = { version = "0.15.0" }
# Plain-old-data derives for the GPU particle instance record (`src/particle_render.rs`):
# `ParticleInstance` is uploaded verbatim as instance-rate vertex data, so it must be
# `Pod` for `RawBufferVec`.
bytemuck = { version = "1.25.1", features = ["derive"] }
bytes = { version = "1.12.0" }
clap = { version = "4.6.1", features = ["cargo", "derive", "env"] }
# Sync-capable channels between the ECS and the world-map tile worker thread
# (std mpsc receivers are not `Sync`, so they cannot sit in a resource).
crossbeam-channel = { version = "0.5.15" }
directories = { version = "6.0.0" }
# The SpaceNavigator / 6-DOF device read (the `spacenav` feature, Linux-only for
# now — see the `viewer-input-spacenav-crossplatform` roadmap task).
evdev = { version = "0.13.2", optional = true }
fluent = { version = "0.16.1" }
fluent_content = { version = "0.0.5" }
fs-err = { version = "3.3.0" }
# `tga` for the sculpt/decode paths; `png` / `jpeg` / `bmp` so the snapshot
# floater (`src/snapshot_floater.rs`) can encode a saved snapshot in the format
# the user picks. The formats unify with the set `bevy_image` already turns on,
# so naming them here only makes the snapshot encoder's requirement explicit.
image = { version = "0.25.10", default-features = false, features = [
    "tga",
    "png",
    "jpeg",
    "bmp",
] }
# Local (system-timezone) time, for the snapshot floater's human-readable
# ISO-8601 filenames. Resolving the system zone reads the `TZ` env var, so the
# zone is captured **once at startup** (before Bevy spawns its task-pool threads)
# and reused — see `snapshot_floater::LocalTimeZone`.
jiff = { version = "0.2.35" }
# A direct dependency purely so the UI font stack (`src/ui_font.rs`) can register
# the bundled faces under private family names: `bevy_text` wraps parley but does
# not re-export it, so `Blob` / `FontInfoOverride` / `GenericFamily` are only
# reachable from parley itself. Kept at `bevy_text`'s own spec so the two unify
# on one parley build (a second copy would mean a second, unrelated font
# collection).
parley = { version = "0.9.0", default-features = false, features = ["std"] }
# The URL-linkification matcher (viewer-url-linkification) scans chat / notice /
# profile text for `http(s)` URLs, SLURLs and `secondlife:///app/...` links,
# faithfully mirroring the reference `llurlregistry` / `llurlentry` regex set.
# The reference's Perl patterns for the subset we recognise use no lookahead or
# backreferences, so the linear-time `regex` crate matches them exactly.
regex = { version = "1.13.1" }
# The blocking HTTP client for the login-time OpenID token POST
# (`viewer-web-openid-auth`): a one-shot POST on a worker thread whose
# `Set-Cookie` primes the embedded browser's shared cookie store. `rustls-tls`
# matches the rest of the workspace (no system OpenSSL).
reqwest = { version = "0.12.15", default-features = false, features = [
    "blocking",
    "rustls-tls",
] }
# The persistent-notification store (viewer-notification-persistence) serializes
# the open (unacknowledged) toasts to a per-account JSON file, so they re-display
# on next login exactly as the reference `LLPersistentNotificationStorage` does.
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145" }
sl-account-dirs = { version = "0.1.0", path = "../sl-account-dirs" }
sl-anim = { version = "0.1.0", path = "../sl-anim" }
sl-cef = { version = "0.1.0", path = "../sl-cef" }
sl-client-bevy = { version = "0.1.0", path = "../sl-client-bevy", features = [
    "bevy_pbr",
] }
# The emoji dataset & lookup layer (viewer-emoji-data): the grouped, searchable
# glyph list the emoji-picker floater (`src/emoji_picker.rs`) presents.
sl-emoji = { version = "0.1.0", path = "../sl-emoji" }
sl-gst = { version = "0.1.0", path = "../sl-gst" }
# Locale-aware value formatting (viewer-i18n-number-datetime-formats): the CLDR/
# ICU-backed number, currency and date/time formatters the `Translator` exposes,
# so a panel writes a grouped balance / coordinate / timestamp for the active
# locale rather than a bare `to_string()`. The text side is `bevy_fluent`; this
# is the value side Fluent's `NUMBER()` / `DATETIME()` cannot do.
sl-l10n = { version = "0.1.0", path = "../sl-l10n" }
# World-map tile fetch / disk cache (`MapTileCache`), shared with the
# sl-map-tools CLI / web tools so the viewer does not grow a third fetcher.
sl-map-apis = { version = "0.8.0" }
sl-media = { version = "0.1.0", path = "../sl-media" }
sl-notecard = { version = "0.1.0", path = "../sl-notecard" }
sl-repl = { version = "0.1.0", path = "../sl-repl" }
sl-settings = { version = "0.1.0", path = "../sl-settings" }
sl-terrain = { version = "0.1.0", path = "../sl-terrain" }
sl-texture = { version = "0.1.0", path = "../sl-texture", features = [
    "encode",
] }
# Shared SL tool types (`MapTileDescriptor` / `ZoomLevel` / `GridCoordinates`)
# so the world-map floater speaks the same tile geometry as `sl-map-apis`.
sl-types = { version = "0.8.0" }
thiserror = { version = "2.0.18" }
# Drives the async `sl-map-apis` tile cache on the world-map tile service's
# dedicated worker thread (a small current-thread runtime, not an app-wide one).
tokio = { version = "1.52.3", features = ["net", "rt", "time"] }
tracing = { version = "0.1.44" }
# Profiling layers wired into our own subscriber (`init_tracing`), behind the
# `profile-*` features. Pinned to the same versions Bevy's `bevy_log` uses so the
# transitive `tracy-client` unifies on one build — Tracy captures only work when
# our `TracyLayer` and Bevy's memory allocator / frame marks share a client.
tracing-chrome = { version = "0.7.0", optional = true }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "tracing-log"] }
tracing-tracy = { version = "0.11.4", optional = true }
unic-langid = { version = "0.9.6", features = ["macros"] }
url = { version = "2.5.8" }

[dev-dependencies]
pretty_assertions = { version = "1.4.1" }
sl-mesh = { version = "0.1.0", path = "../sl-mesh" }
sl-proto = { version = "0.1.0", path = "../sl-proto" }

[lints]
workspace = true
