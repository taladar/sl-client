[package]
name = "sl-llsd"
version = { workspace = true }
authors = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
description = "LLSD (Linden Lab Structured Data) value model and codecs for Second Life / OpenSim tooling"
readme = { workspace = true }
license = { workspace = true }

repository = { workspace = true }
keywords = ["codec", "encoding", "llsd", "opensim", "secondlife"]
categories = ["encoding", "parser-implementations"]
publish = { workspace = true }

[features]
# Derive `serde::Serialize`/`serde::Deserialize` on the `Llsd` value model so
# containing types (e.g. sl-wire's login structures) can derive serde too.
serde = ["dep:serde", "uuid/serde"]

[dependencies]
base64 = { workspace = true }
roxmltree = { workspace = true }
serde = { workspace = true, features = ["derive"], optional = true }
thiserror = { workspace = true }
time = { workspace = true, features = ["formatting", "parsing"] }
uuid = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }

[lints]
workspace = true
