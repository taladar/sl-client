# Workspace-local cargo configuration.

[env]
# Where the cef-dll-sys build script downloads/looks up the prebuilt CEF
# binary distribution. Pinning it inside the workspace (gitignored) keeps the
# ~1 GB download out of `target/` so `cargo clean` does not force a
# re-download. `force = false` (the default) lets a developer override it
# with their own CEF_PATH.
CEF_PATH = { value = ".cef", relative = true }

[target.x86_64-unknown-linux-gnu]
# Link with mold. Note this is an lld -> mold upgrade, not the usual GNU-ld ->
# lld one: this toolchain's `cc` already defaults to `-fuse-ld=lld`, so the
# common "configure a fast linker" advice was already half-applied. mold
# parallelises link work across cores, which matters most for the viewer
# binaries (the largest links in the workspace).
rustflags = ["-Clink-arg=-fuse-ld=mold"]
# Doc tests link too, and are a known slow spot (bevyengine/bevy#12207).
rustdocflags = ["-Clink-arg=-fuse-ld=mold"]
