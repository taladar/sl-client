[package]
name = "sl-repl-bevy"
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
description = "Interactive Bevy-driven Second Life / OpenSim REPL test client built on sl-repl and sl-client-bevy"
readme = { workspace = true }
license = { workspace = true }

repository = { workspace = true }
keywords = ["cli", "client", "opensim", "repl", "secondlife"]
categories = ["command-line-utilities", "network-programming"]
publish = { workspace = true }

exclude = { workspace = true }

[dependencies]
bevy = { version = "0.19.0", default-features = false }
clap = { workspace = true, features = ["cargo", "derive", "env"] }
clap_complete = { workspace = true }
clap_mangen = { workspace = true }
crossbeam-channel = { workspace = true }
# `clippy.toml` disallows `std::fs` so a read error names the file it failed
# on — here the REPL script the user asked to run.
fs-err = { workspace = true }
rustyline = { workspace = true }
sl-account-dirs = { workspace = true }
sl-client-bevy = { workspace = true }
sl-repl = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "tracing-log"] }
url = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }

[lints]
workspace = true
