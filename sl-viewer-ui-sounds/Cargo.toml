[package]
name = "sl-viewer-ui-sounds"
description = "The Second Life / OpenSim viewer's own 2-D feedback sounds: the catalogue, its persisted overrides, and the skin's `-sk-uisnd-*` properties"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
readme.workspace = true
repository.workspace = true
license.workspace = true
keywords = ["secondlife", "opensim", "viewer", "ui", "audio"]
categories = ["gui", "game-development", "multimedia::audio"]
exclude.workspace = true
publish.workspace = true

[dependencies]
# Not a workspace dependency: members disagree about `default-features`, so the
# spec stays per-crate (see the root manifest).
bevy = { version = "0.19.0" }
# The skin overrides (`-sk-uisnd-<key>`) are real CSS properties, parsed and
# resolved by the same engine the skin system stands up.
bevy_flair = { version = "0.8.0" }
sl-audio = { path = "../sl-audio", version = "0.1.0" }
sl-client-bevy = { workspace = true }
sl-settings = { workspace = true }
sl-viewer-platform = { workspace = true }
sl-viewer-settings = { workspace = true }
sl-viewer-ui-core = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }

[lints]
workspace = true
