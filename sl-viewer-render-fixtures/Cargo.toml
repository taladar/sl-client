[package]
name = "sl-viewer-render-fixtures"
description = "The Second Life / OpenSim viewer's render-scene registry: the procedural prims, sculpts, meshes, skeletons and lit scenes the render gallery and the render harness both draw, built with no login and no region"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
readme.workspace = true
repository.workspace = true
license.workspace = true
keywords = ["secondlife", "opensim", "viewer", "rendering", "testing"]
categories = ["game-development", "rendering"]
exclude.workspace = true
publish.workspace = true

[dependencies]
# Not a workspace dependency: members disagree about `default-features`, so the
# spec stays per-crate (see the root manifest).
bevy = { version = "0.19.0" }
bytes = { workspace = true }
sl-avatar = { workspace = true }
sl-client-bevy = { workspace = true, features = [
  "bevy_pbr",
] }
sl-terrain = { path = "../sl-terrain", version = "0.1.0" }
sl-viewer-kit = { workspace = true }
sl-viewer-world-api = { workspace = true }
sl-viewer-world-objects = { workspace = true }
sl-viewer-world-scene = { workspace = true }

[lints]
workspace = true
