[package]
name = "sl-viewer-world-view"
description = "The Second Life / OpenSim viewer's view layer: the camera, physics, picking and input routing through which the user looks at and touches the world"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
readme.workspace = true
repository.workspace = true
license.workspace = true
keywords = ["secondlife", "opensim", "viewer", "rendering"]
categories = ["game-development", "rendering"]
exclude.workspace = true
publish.workspace = true

[dependencies]
# Not a workspace dependency: members disagree about `default-features`, so the
# spec stays per-crate (see the root manifest).
bevy = { version = "0.19.0" }
clap = { workspace = true, features = ["cargo", "derive", "env"] }
image = { version = "0.25.10", default-features = false, features = [
  "bmp",
  "jpeg",
  "png",
  "tga",
] }
parry3d = "0.27.0"
sl-cef = { path = "../sl-cef", version = "0.1.0" }
sl-client-bevy = { workspace = true, features = [
  "bevy_pbr",
] }
sl-settings = { path = "../sl-settings", version = "0.1.0" }
sl-viewer-kit = { workspace = true }
sl-viewer-media = { workspace = true }
sl-viewer-settings = { workspace = true }
sl-viewer-spacenav = { workspace = true }
sl-viewer-world-api = { workspace = true }
sl-viewer-world-avatar = { workspace = true }
sl-viewer-world-objects = { workspace = true }
sl-viewer-world-scene = { workspace = true }
url = { workspace = true }
wgpu-types = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
sl-proto = { workspace = true }
sl-viewer-testkit = { workspace = true }

[lints]
workspace = true
