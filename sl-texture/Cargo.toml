[package]
name = "sl-texture"
version = { workspace = true }
authors = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
description = "Decoding texture fetch API and cache (LOD-aware store + Firestorm-compatible on-disk cache) for Second Life / OpenSim clients"
readme = { workspace = true }
license = { workspace = true }

repository = { workspace = true }
keywords = ["cache", "jpeg2000", "opensim", "secondlife", "texture"]
categories = ["caching", "game-development", "network-programming"]
publish = { workspace = true }

exclude = { workspace = true }

[features]
default = ["decode"]
# Pulls in the OpenJPEG C dependency (via `jpeg2k`) for real pixel decoding.
decode = ["dep:jpeg2k"]
# Pulls in the in-workspace OpenJPEG encoder (`sl-j2c-encode`) for real pixel
# encoding (RGBA8 -> `.j2c`), used to publish a client-composited avatar bake.
encode = ["dep:sl-j2c-encode"]

[dependencies]
arc-swap = { workspace = true }
async-lock = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
dashmap = { workspace = true }
event-listener = { workspace = true }
fs-err = { workspace = true }
jpeg2k = { version = "0.10.1", optional = true }
num_cpus = { workspace = true }
parking_lot = { workspace = true }
sl-asset-sched = { workspace = true }
sl-j2c-encode = { path = "../sl-j2c-encode", version = "0.1.0", optional = true }
sl-proto = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
pollster = { workspace = true }
pretty_assertions = { workspace = true }

[lints]
workspace = true
