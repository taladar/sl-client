[package]
name = "sl-viewer-inventory"
description = "The Second Life / OpenSim viewer's inventory: the folder and item model, the tree and gallery views, filters, item properties, and dragging items out into the world"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
readme.workspace = true
repository.workspace = true
license.workspace = true
keywords = ["secondlife", "opensim", "viewer", "inventory"]
categories = ["game-development"]
exclude.workspace = true
publish.workspace = true

[dependencies]
# Not a workspace dependency: members disagree about `default-features`, so the
# spec stays per-crate (see the root manifest).
bevy = { version = "0.19.0" }
sl-client-bevy = { workspace = true, features = [
  "bevy_pbr",
] }
sl-settings = { path = "../sl-settings", version = "0.1.0" }
sl-viewer-kit = { workspace = true }
sl-viewer-settings = { workspace = true }
sl-viewer-ui-core = { workspace = true }
sl-viewer-ui-widgets = { workspace = true }
sl-viewer-world = { workspace = true }
sl-viewer-world-api = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }

[lints]
workspace = true
