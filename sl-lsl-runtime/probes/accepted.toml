# OpenSim raises a link's changed events while its scene is still changing
# the linkset on another thread, so what each handler reads of it (its link
# number, the prim count) and in which order the prims print is whichever
# state it catches.

[[difference]]
probe = "prim/link-refusals"
between = ["opensim-yengine", "fake-opensim"]
record = "far-changed"
fields = { bits = "32768" }
field = "link"
reason = "OpenSim's handler read the far prim's link number while the linking thread had not yet numbered it (link 0 with two prims counted); the fake grid's handlers read the linkset as the link left it"

