# The differences between two grids' runs of a probe that are known and
# accepted (`sl-conformance compare-probes` lists them as `accepted`, apart
# from the findings). An entry without a `task` is a deliberate difference;
# with one, a known defect that roadmap task removes. The format is in the
# book's `tools/lsl-probes.md`, § Accepted differences.
#
# The entries below cover the differential suite (`sl-conformance
# differential`): every difference it shows is fixed or listed here. The
# rest of the corpus is triaged in `test-lsl-differential-corpus-triage`.

# --- math ---------------------------------------------------------------

[[difference]]
probe = "math/rotations"
between = ["opensim-yengine", "fake-opensim"]
record = "euler2rot-back"
fields = { case = "past-a-turn" }
field = "value"
reason = "OpenSim's rotation functions compute in double and print the sixth decimal a float rounds away; the runtime's values are floats on every flavour"

[[difference]]
probe = "math/rotations"
between = ["aditi", "fake-sl"]
record = "euler2rot-back"
fields = { case = "xyz30-45-60" }
field = "value"
reason = "llEuler2Rot's last bits: the runtime takes PyOptimizer's double form, within three units in the last place of aditi's, as no arrangement of Linden's code tried matches them"

[[difference]]
probe = "math/functions"
between = ["opensim-yengine", "fake-opensim"]
record = "pow"
fields = { case = "1e30^2" }
field = "value"
reason = "OpenSim's floats are doubles, so 1e60 is a number there; the runtime's values are floats on every flavour, and the square overflows to Infinity"

[[difference]]
probe = "math/functions"
between = ["opensim-yengine", "fake-opensim"]
record = "pow"
fields = { case = "1e-6^-7" }
field = "value"
reason = "OpenSim's floats are doubles, so 1e42 is a number there; the runtime's values are floats on every flavour"

[[difference]]
probe = "math/functions"
between = ["opensim-yengine", "fake-opensim"]
record = "tan"
fields = { case = "pi/2" }
field = "value"
reason = "OpenSim takes the tangent of PI_BY_TWO in double and prints its digits; a float keeps seven"

[[difference]]
probe = "math/functions"
between = ["opensim-yengine", "fake-opensim"]
record = "tan"
fields = { case = "1e30" }
field = "value"
reason = "OpenSim's 1e30 is a double, the runtime's a float a little apart from it, and the tangent of either is a different number"

# --- strings ------------------------------------------------------------

[[difference]]
probe = "strings/functions"
between = ["aditi", "fake-sl"]
record = "base64-integer"
fields = { case = "junk" }
field = "value"
reason = "Second Life answers llBase64ToInteger of text with no Base64 at its front with a different number each run (15204949, then 12523626): not a defined value; the runtime answers 0"

