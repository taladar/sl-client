[package]
name = "sl-crosscheck"
version = { workspace = true }
authors = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
description = "Runs this workspace's viewer and Firestorm against one fake grid and collects what each of them drew, so a person can compare them"
readme = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
keywords = ["opensim", "secondlife", "testing", "viewer", "comparison"]
categories = ["command-line-utilities", "simulation"]
exclude = { workspace = true }
publish = { workspace = true }

[[bin]]
name = "sl-crosscheck"
path = "src/bin/sl-crosscheck.rs"

[dependencies]
clap = { workspace = true, features = ["cargo", "derive", "env"] }
# A local `.env` so a machine's Firestorm build path is configured once and
# never typed (or committed) again.
dotenvy = "0.15.7"
fs-err = { workspace = true }
# `kill` with a signal of our choosing: `Child::kill` is SIGKILL only, and a
# viewer killed outright never sends its LogoutRequest.
nix = { version = "0.31.3", features = ["signal"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
signal-hook = { version = "0.4.4", default-features = false }
sl-fake-grid = { path = "../sl-fake-grid", version = "0.1.0" }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "time"] }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "tracing-log"] }
url = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }

[lints]
workspace = true
