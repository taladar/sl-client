[package]
name = "sl-wire"
version = { workspace = true }
authors = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
description = "Sans-I/O codec for the Second Life / OpenSim LLUDP wire protocol and XML-RPC login"
readme = { workspace = true }
license = { workspace = true }

repository = { workspace = true }
keywords = ["codec", "lludp", "opensim", "protocol", "secondlife"]
categories = ["encoding", "network-programming", "parser-implementations"]
publish = { workspace = true }

exclude = { workspace = true }

[features]
# Derive `serde::Serialize` on the generated message/block structs and
# `AnyMessage`, so decoded messages can be serialized (e.g. to JSON) by tools.
serde = ["dep:serde", "sl-llsd/serde", "url/serde", "uuid/serde"]

[dependencies]
base64 = { workspace = true }
md5 = { workspace = true }
miniz_oxide = { version = "0.8.9" }
roxmltree = { workspace = true }
serde = { workspace = true, features = ["derive"], optional = true }
sl-llsd = { workspace = true }
sl-lsl = { workspace = true }
sl-types = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }

[build-dependencies]
fs-err = { workspace = true }
sl-msg-template = { path = "../sl-msg-template", version = "0.1.0" }

[dev-dependencies]
pretty_assertions = { workspace = true }

[lints]
workspace = true
