[package]
name = "sl-viewer-chat"
description = "The Second Life / OpenSim viewer's chat surfaces: the nearby-chat overlay and bar, the chat input with its emoji picker, and local chat submission"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
readme.workspace = true
repository.workspace = true
license.workspace = true
keywords = ["secondlife", "opensim", "viewer", "chat"]
categories = ["game-development"]
exclude.workspace = true
publish.workspace = true

[dependencies]
# Not a workspace dependency: members disagree about `default-features`, so the
# spec stays per-crate (see the root manifest).
bevy = { version = "0.19.0" }
# The emoji completer's selected row takes the shared `.sk-active` class, so
# this crate names the CSS engine directly. Already in the closure through
# sl-viewer-ui-core; the package set is unchanged.
bevy_flair = { version = "0.8.0" }
sl-client-bevy = { workspace = true, features = [
  "bevy_pbr",
] }
sl-emoji = { path = "../sl-emoji", version = "0.1.0" }
sl-settings = { path = "../sl-settings", version = "0.1.0" }
sl-viewer-intents = { workspace = true }
sl-viewer-settings = { workspace = true }
sl-viewer-social = { workspace = true }
sl-viewer-ui-core = { workspace = true }
sl-viewer-ui-widgets = { workspace = true }
sl-viewer-world-api = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
sl-viewer-testkit = { workspace = true }

[lints]
workspace = true
