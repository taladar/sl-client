[package]
name = "sl-viewer-ui-context-menus"
description = "The Second Life / OpenSim viewer's right-click context menus: the entry trees behind the avatar, object, attachment and land pie menus"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
readme.workspace = true
repository.workspace = true
license.workspace = true
keywords = ["secondlife", "opensim", "viewer", "ui", "menu"]
categories = ["gui", "game-development"]
exclude.workspace = true
publish.workspace = true

[dependencies]
# Not a workspace dependency: members disagree about `default-features`, so the
# spec stays per-crate (see the root manifest).
bevy = { version = "0.19.0" }
sl-client-bevy = { workspace = true }
sl-viewer-edit = { workspace = true }
sl-viewer-intents = { workspace = true }
sl-viewer-inventory = { workspace = true }
sl-viewer-kit = { workspace = true }
sl-viewer-people = { workspace = true }
sl-viewer-places = { workspace = true }
sl-viewer-social = { workspace = true }
sl-viewer-ui-core = { workspace = true }
sl-viewer-ui-pie-menu = { workspace = true }
sl-viewer-ui-widgets = { workspace = true }
sl-viewer-world-api = { workspace = true }
sl-viewer-world-avatar = { workspace = true }
sl-viewer-world-objects = { workspace = true }
sl-viewer-world-view = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }

[lints]
workspace = true
