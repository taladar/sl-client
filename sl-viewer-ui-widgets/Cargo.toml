[package]
name = "sl-viewer-ui-widgets"
description = "The Second Life / OpenSim viewer's widgets: floaters, menus, text input, tabs, tables and the two-way settings binding"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
readme.workspace = true
repository.workspace = true
license.workspace = true
keywords = ["secondlife", "opensim", "viewer", "ui", "widgets"]
categories = ["gui", "game-development"]
exclude.workspace = true
publish.workspace = true

[dependencies]
# Not a workspace dependency: members disagree about `default-features`, so the
# spec stays per-crate (see the root manifest). `system_font_discovery` because
# these widgets measure and lay out real text.
bevy = { version = "0.19.0", features = ["system_font_discovery"] }
bevy_flair = { version = "0.8.0" }
parley = { version = "0.9.0", default-features = false, features = ["std"] }
sl-emoji = { path = "../sl-emoji", version = "0.1.0" }
sl-settings = { workspace = true }
sl-viewer-settings = { workspace = true }
sl-viewer-ui-core = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
sl-viewer-testkit = { workspace = true }

[lints]
workspace = true
